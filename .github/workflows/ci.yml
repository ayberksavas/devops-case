name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Minimum perms needed:
#   contents: read   — checkout
#   packages: write  — push image to GHCR (only used on non-PR events)
permissions:
  contents: read
  packages: write

# PR pushes supersede in-flight runs. main pushes always run to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/devops-case-app
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 scans the full git history, not just the tip commit —
      # catches a secret that was committed earlier and later "fixed" by removal.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Install the binary directly (skip gitleaks/gitleaks-action wrapper —
      # the wrapper requires GITLEAKS_LICENSE for orgs; binary is BSD-licensed and free).
      - name: install gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # --redact ensures any finding output in CI logs is masked,
      # so a leaked secret isn't re-leaked through the public Action log.
      - name: scan
        run: gitleaks detect --source . --no-banner --verbose --redact

  # Proves the GitHub <-> AWS OIDC trust works end-to-end on every run.
  # No long-lived AWS keys involved: GitHub mints a short-lived OIDC token,
  # AWS exchanges it for temporary credentials via sts:AssumeRoleWithWebIdentity.
  # The role itself has no permission policies attached yet — sts:GetCallerIdentity
  # works without any. Day 3.4 will add ssm:SendCommand for auto-deploy.
  # Not in `build.needs:` because OIDC is informational, not a security gate.
  aws-oidc:
    name: aws OIDC (whoami)
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # required for GitHub to mint the OIDC token
      contents: read      # default for checkout-less jobs; explicit for clarity
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.1.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: aws sts get-caller-identity

  build:
    name: build, scan, push
    needs: [lint, test, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      # Tag plan:
      #   PR      → :pr-<num>           (built + scanned, not pushed)
      #   main    → :main, :<short-sha> (pushed)
      #   v0.1.0  → :0.1.0, :latest     (pushed; :latest tracks releases, not main)
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      # Load into the local docker daemon so Trivy can scan before any push.
      - name: build (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Fail on CRITICAL/HIGH so a vulnerable image never reaches GHCR.
      # --ignore-unfixed skips findings with no upstream fix available
      # (otherwise base-image noise can hold up releases for no actionable reason).
      #
      # Install the binary directly (mirrors the gitleaks job pattern). The
      # aquasecurity/trivy-action and aquasecurity/setup-trivy actions both do an
      # internal sparse-checkout of the aquasecurity/trivy repo (for contrib/
      # templates), which uses `--filter=blob:none` and a promisor remote. That
      # lazy fetch intermittently fails on hosted runners with
      # "could not read Username for https://github.com: terminal prompts disabled".
      # Skipping the wrapper bypasses the flake entirely.
      - name: install trivy
        run: |
          TRIVY_VERSION=0.70.0
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar -xz -C /usr/local/bin trivy

      - name: scan (trivy)
        run: |
          trivy image \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --pkg-types os,library \
            --exit-code 1 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

      - name: login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Second build-push is a cache hit on every layer; effectively a push-only step.
      - name: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
