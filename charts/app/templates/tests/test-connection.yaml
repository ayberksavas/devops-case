apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "app.fullname" . }}-test-connection"
  labels:
    {{- include "app.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: ping
      image: busybox:1.37
      command: ["wget"]
      args:
        - "--spider"
        - "-q"
        - "http://{{ include "app.fullname" . }}:{{ .Values.service.port }}/ping"
