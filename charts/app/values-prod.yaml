# Production overlay.
# Restated explicitly (even though some values match the chart defaults) so that this
# file alone tells you what prod looks like, without having to cross-reference values.yaml.

replicaCount: 2

ingress:
  hosts:
    - host: devops-case.local
      paths:
        - path: /
          pathType: Prefix

# Day 4.2: ServiceMonitor + PrometheusRule + dashboard ConfigMap are rendered
# only in prod, where the kube-prometheus-stack is installed (see
# scripts/install-monitoring.sh + monitoring/values.yaml).
monitoring:
  enabled: true
